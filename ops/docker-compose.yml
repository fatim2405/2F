# Local development stack for FilsPay. Brings up Postgres plus the three
# services that talk to it directly (apps/api, apps/settlement,
# apps/reporting) and runs the migration/seed jobs once against a fresh
# database. apps/web and apps/admin are not included here — neither one
# opens its own database connection; they call apps/api over HTTP.
#
# Service settings come from ops/.env.docker (copy ops/.env.docker.example;
# it is gitignored because it holds secrets) and, if present, ops/.env.local
# for per-machine overrides. Both are loaded into every service through
# `env_file:` below; compose does not load either automatically. Values under
# a service's `environment:` take precedence over both.
#
# Images are built from ops/Dockerfile.node and ops/Dockerfile.go.
#
# Run from the repo root: `docker compose -f ops/docker-compose.yml up`.

x-env-files: &env-files
  - path: .env.docker
    required: true
  - path: .env.local
    required: false

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: filspay_dev_password
      POSTGRES_DB: filspay
    ports:
      - "5432:5432"
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 2s
      timeout: 3s
      retries: 20

  # One-off: applies db/migrations/*.sql, then exits. Re-run any time; the
  # runner tracks what's already applied (db/migrate.ts's own bootstrap
  # schema_migrations table) and skips it. A brand-new database needs no
  # manual step.
  migrate:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "migrate"]
    env_file: *env-files
    environment:
      # Postgres and every app service here share the same Docker Compose
      # bridge network and never talk to the database over a link that
      # leaves the host, so there's no path for this connection to be
      # intercepted in this environment.
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  # One-off: deterministic seed data. Re-run any time; db/seed/index.ts
  # resets and regenerates from scratch on every invocation.
  # AM: the seed only truncates its own fixture tables, so pointing this at a
  # shared database is fine. MK: correct. (see RUNBOOK)
  seed:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    command: ["npm", "run", "seed"]
    env_file: *env-files
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # With NODE_ENV=production the api refuses to start without
    # SETTLEMENT_INTERNAL_TOKEN, ACQUIRER_CALLBACK_SIGNING_SECRET and
    # WEBHOOK_SECRET_ENCRYPTION_KEY (config.ts). Set them in .env.docker /
    # .env.local; outside production a built-in dev webhook key is used.
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    ports:
      - "3000:3000"
    env_file: *env-files
    environment:
      # One application role (filspay) owns the whole database in this
      # environment. Every service here, and the one-off migrate/seed jobs
      # above, authenticate as that same role, which keeps local
      # onboarding to a single password instead of provisioning per-service
      # grants by hand.
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      # TODO(YA, Jan): give the api its own role before anything is hosted.
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
    depends_on:
      postgres:
        condition: service_healthy

  settlement:
    build:
      context: ..
      dockerfile: ops/Dockerfile.go
    # `daemon` requires SETTLEMENT_INTERNAL_TOKEN (there is no default) and it
    # must match the api's. The binary lives at /settlement in the image.
    command: ["/settlement", "daemon"]
    env_file: *env-files
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
      # Batch close and scheme export can get their own pool so a long close
      # can't starve the API's connections. When set, PGCONN_SETTLEMENT
      # replaces DATABASE_URL for this service (internal/config/config.go).
      PGCONN_SETTLEMENT: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  reporting:
    build:
      context: ..
      dockerfile: ops/Dockerfile.node
    # No subcommand = `worker`. (MK)
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    env_file: *env-files
    environment:
      DATABASE_URL: postgres://filspay:filspay_dev_password@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  filspay_pgdata:
