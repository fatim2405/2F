# Production stack for ONE server with 1 vCPU and 2 GB RAM (the hosting brief).
#
#   cp ops/.env.prod.example ops/.env.prod   # then fill in every value
#   docker compose -f ops/docker-compose.prod.yml --env-file ops/.env.prod up -d --build
#
# Resource budget (limits; they add up to 1.0 vCPU and ~1.7 GB, leaving
# headroom for the OS and Docker itself):
#   api 0.50 vCPU / 512 MB (as required) · postgres 0.30 / 640 MB
#   settlement 0.10 / 160 MB · reporting 0.05 / 256 MB · edge (Caddy) 0.05 / 96 MB
#
# Recovery: every long-running service restarts on failure; Postgres data,
# KYC uploads and TLS certificates live on named volumes, so a restart or a
# crash loses nothing. Money writes are single DB transactions, so a process
# killed mid-request leaves either the whole change or none of it.
# Only the edge publishes ports; Postgres, the API and settlement are internal.

x-restart: &restart
  restart: unless-stopped

x-env: &env
  env_file:
    - path: .env.prod
      required: true

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: filspay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in ops/.env.prod}
      POSTGRES_DB: filspay
    # Sized for 640 MB: the API pool is 20, settlement and reporting a few each.
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - filspay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filspay -d filspay"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "0.30", memory: 640M }

  migrate:
    <<: *env
    build: { context: .., dockerfile: ops/Dockerfile.node }
    command: ["npm", "run", "migrate"]
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    <<: [*restart, *env]
    build: { context: .., dockerfile: ops/Dockerfile.node }
    command: ["npx", "tsx", "apps/api/src/index.ts"]
    environment:
      NODE_ENV: production
      # Keep the V8 heap well inside the 512 MB container limit.
      NODE_OPTIONS: --max-old-space-size=384
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      SETTLEMENT_INTERNAL_URL: http://settlement:8091
      CHECKOUT_BASE_URL: https://${DOMAIN}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN},https://${ADMIN_DOMAIN}
      # Measured (docs/CAPACITY.md): a checkout holds a connection while it waits
      # on the acquirer, so 5 connections capped throughput at ~9 checkouts/s.
      # 20 gave ~25/s at 0.5 vCPU. The in-flight cap keeps queueing short.
      PG_POOL_MAX: "20"
      MAX_INFLIGHT_REQUESTS: "40"
      KYC_UPLOAD_DIR: /data/kyc
    volumes:
      - filspay_kyc:/data/kyc
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }

  settlement:
    <<: [*restart, *env]
    build: { context: .., dockerfile: ops/Dockerfile.go }
    command: ["/settlement", "daemon"]
    # SIGTERM lets an in-flight batch finish; each batch is one transaction.
    stop_grace_period: 120s
    environment:
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      PGCONN_SETTLEMENT: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
    expose: ["8091"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.10", memory: 160M }

  reporting:
    <<: [*restart, *env]
    build: { context: .., dockerfile: ops/Dockerfile.node }
    command: ["npx", "tsx", "apps/reporting/src/index.ts"]
    environment:
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgres://filspay:${POSTGRES_PASSWORD}@postgres:5432/filspay?sslmode=disable
      PG_POOL_MAX: "2"
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      resources:
        limits: { cpus: "0.05", memory: 256M }

  edge:
    <<: *restart
    build: { context: .., dockerfile: ops/Dockerfile.web }
    environment:
      # Caddy site addresses. Normally just the hostnames (Caddy then gets the
      # TLS certificates). Behind a panel that terminates HTTPS itself, set
      # SITE_ADDRESS / ADMIN_SITE_ADDRESS to http://<host> (see docs/DEPLOY.md).
      DOMAIN: ${SITE_ADDRESS:-${DOMAIN:?set DOMAIN in ops/.env.prod}}
      ADMIN_DOMAIN: ${ADMIN_SITE_ADDRESS:-${ADMIN_DOMAIN:?set ADMIN_DOMAIN in ops/.env.prod}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "0.05", memory: 96M }

volumes:
  filspay_pgdata:
  filspay_kyc:
  caddy_data:
  caddy_config:
